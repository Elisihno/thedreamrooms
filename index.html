<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Dream Rooms</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #stick { position: fixed; display: none; width: 140px; height: 140px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); pointer-events: none; }
  #knob { position: absolute; left: 45px; top: 45px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.35); }
  #floor { position: fixed; left: 16px; bottom: 16px; color: rgba(255,255,255,.55); font: 600 13px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; pointer-events: none; }
  #dot { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(255,255,255,.45); pointer-events: none; }
  #use { position: fixed; right: 16px; bottom: 16px; padding: 16px 26px; border-radius: 12px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.16); color: #fff; font: 600 16px system-ui, sans-serif; z-index: 2; }
  #use[hidden] { display: none; }
  #inv { position: fixed; top: 40px; right: 12px; display: flex; gap: 8px; pointer-events: none; }
  .slot { padding: 0; cursor: pointer; pointer-events: auto; position: relative; width: 52px; height: 52px; border-radius: 8px; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
  .slot.sel { border-color: #fff; background: rgba(255,255,255,.22); box-shadow: 0 0 0 2px rgba(255,255,255,.5); }
  .slot img { max-width: 44px; max-height: 44px; }
  .slot span { position: absolute; right: 3px; bottom: 1px; color: #fff; font: 700 12px system-ui, sans-serif; }
  #toast { position: fixed; left: 0; right: 0; bottom: 72px; text-align: center; color: #fff; font: 600 14px system-ui, sans-serif; pointer-events: none; }
  #toast[hidden] { display: none; }
  #hint { position: fixed; left: 0; right: 0; top: 12px; text-align: center; color: rgba(255,255,255,.5); font: 13px system-ui, sans-serif; pointer-events: none; }
</style>
</head>
<body>
<div id="hint">Left side: move &middot; Right side: look &middot; (Desktop: WASD, click to look)</div>
<div id="dot"></div>
<div id="floor"></div>
<button id="use" hidden>Open</button>
<div id="inv"></div>
<div id="toast" hidden></div>
<div id="stick"><div id="knob"></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
