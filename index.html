<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Dream Rooms</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #stick { position: fixed; display: none; width: 140px; height: 140px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); pointer-events: none; }
  #knob { position: absolute; left: 45px; top: 45px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.35); }
  #floor { position: fixed; left: 16px; bottom: 16px; color: rgba(255,255,255,.55); font: 600 13px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; pointer-events: none; }
  #dot { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(255,255,255,.45); pointer-events: none; }
  /* the hand cursor: appears at the crosshair when you can use what you are looking at */
  #use { position: fixed; left: 50%; top: 50%; width: 84px; height: 84px; margin: -42px 0 0 -42px; padding: 0; border: 0; background: none; z-index: 2; cursor: pointer; animation: reach .9s ease-in-out infinite alternate; }
  #use img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 5px rgba(0,0,0,.7)); pointer-events: none; }
  #use[hidden], #dot[hidden] { display: none; }
  @keyframes reach { from { transform: scale(1); } to { transform: scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { #use { animation: none; } }
  #use::after { content: attr(data-label); position: absolute; left: 50%; top: 100%; transform: translateX(-50%); white-space: nowrap; color: #fff; font: 600 13px system-ui, sans-serif; text-shadow: 0 1px 4px #000; }
  /* dark edges while hiding */
  #hide { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,.9) 100%); }
  #win { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; text-align: center; background: rgba(0,0,0,.88); color: #fff; font-family: system-ui, sans-serif; }
  #win[hidden] { display: none; }
  #win h1 { margin: 0 0 8px; font-size: 40px; letter-spacing: .04em; }
  #win p { margin: 0 0 24px; opacity: .8; }
  #win button { padding: 14px 28px; border-radius: 12px; border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.14); color: #fff; font: 600 16px system-ui, sans-serif; cursor: pointer; }
  #keypad, #note { position: fixed; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.75); font-family: system-ui, sans-serif; color: #fff; }
  #keypad[hidden], #note[hidden] { display: none; }
  .kp { width: min(300px, 86vw); max-height: 94vh; padding: 16px; border-radius: 14px; background: #1b1e22; border: 1px solid rgba(255,255,255,.2); text-align: center; }
  #kpDisplay { font: 700 30px ui-monospace, monospace; letter-spacing: .1em; padding: 8px 0; border-radius: 8px; background: #0b0d0f; color: #ff6a5a; }
  #kpDisplay.bad { animation: shake .3s; }
  #kpMsg { margin: 8px 0 10px; font-size: 13px; opacity: .8; min-height: 16px; }
  #kpGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #kpGrid button { padding: 0; height: 46px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: #2a2e33; color: #fff; font: 600 20px system-ui, sans-serif; cursor: pointer; }
  @keyframes shake { 20% { transform: translateX(-6px); } 60% { transform: translateX(6px); } }
  .noteCard { text-align: center; }
  .noteCard img { width: min(300px, 70vh); max-width: 80vw; transform: rotate(-2deg); box-shadow: 0 8px 30px rgba(0,0,0,.6); }
  .noteCard p { margin: 14px 0 0; opacity: .7; font-size: 13px; }
  #fire { position: fixed; right: 16px; bottom: 16px; z-index: 2; width: 84px; height: 84px; border-radius: 50%; border: 2px solid rgba(255,120,100,.7); background: rgba(160,30,20,.45); color: #fff; font: 700 15px system-ui, sans-serif; letter-spacing: .06em; cursor: pointer; }
  #fire[hidden] { display: none; }
  #inv { position: fixed; top: 40px; right: 12px; display: flex; gap: 8px; pointer-events: none; }
  .slot { padding: 0; cursor: pointer; pointer-events: auto; position: relative; width: 52px; height: 52px; border-radius: 8px; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
  .slot.sel { border-color: #fff; background: rgba(255,255,255,.22); box-shadow: 0 0 0 2px rgba(255,255,255,.5); }
  .slot img { max-width: 44px; max-height: 44px; }
  .slot span { position: absolute; right: 3px; bottom: 1px; color: #fff; font: 700 12px system-ui, sans-serif; }
  #toast { position: fixed; left: 0; right: 0; bottom: 72px; text-align: center; color: #fff; font: 600 14px system-ui, sans-serif; pointer-events: none; }
  #toast[hidden] { display: none; }
  #hint { position: fixed; left: 0; right: 0; top: 12px; text-align: center; color: rgba(255,255,255,.5); font: 13px system-ui, sans-serif; pointer-events: none; }
</style>
</head>
<body>
<div id="hint">Left side: move &middot; Right side: look &middot; (Desktop: WASD, click to look)</div>
<div id="hide"></div>
<div id="dot"></div>
<div id="floor"></div>
<button id="use" type="button" aria-label="Use" hidden><img alt=""></button>
<div id="inv"></div>
<div id="toast" hidden></div>
<button id="fire" type="button" hidden>FIRE</button>
<div id="win" hidden><div><h1>You escaped</h1><p id="winTime"></p><button id="again" type="button">Play again</button></div></div>
<div id="keypad" hidden><div class="kp"><div id="kpDisplay">_ _ _ _</div><div id="kpMsg"></div><div id="kpGrid"></div></div></div>
<div id="note" hidden><div class="noteCard"><img id="noteImg" alt="Sticky note"><p>Tap to put it away</p></div></div>
<div id="stick"><div id="knob"></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
