<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Dream Rooms</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #stick { position: fixed; display: none; width: 140px; height: 140px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); pointer-events: none; }
  #knob { position: absolute; left: 45px; top: 45px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.35); }
  #floor { position: fixed; left: 16px; bottom: 16px; color: rgba(255,255,255,.55); font: 600 13px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; pointer-events: none; }
  #dot { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(255,255,255,.45); pointer-events: none; }
  /* the hand cursor: appears at the crosshair when you can use what you are looking at */
  #use { position: fixed; left: 50%; top: 50%; width: 84px; height: 84px; margin: -42px 0 0 -42px; padding: 0; border: 0; background: none; z-index: 2; cursor: pointer; animation: reach .9s ease-in-out infinite alternate; }
  #use img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 5px rgba(0,0,0,.7)); pointer-events: none; }
  #use[hidden], #dot[hidden] { display: none; }
  @keyframes reach { from { transform: scale(1); } to { transform: scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { #use { animation: none; } }
  #use::after { content: attr(data-label); position: absolute; left: 50%; top: 100%; transform: translateX(-50%); white-space: nowrap; color: #fff; font: 600 13px system-ui, sans-serif; text-shadow: 0 1px 4px #000; }
  /* dark edges while hiding */
  #hide { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,.9) 100%); }
  #win { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; text-align: center; background: rgba(0,0,0,.88); color: #fff; font-family: system-ui, sans-serif; }
  #win[hidden] { display: none; }
  #win h1 { margin: 0 0 8px; font-size: 40px; letter-spacing: .04em; }
  #win p { margin: 0 0 24px; opacity: .8; }
  #win button { padding: 14px 28px; border-radius: 12px; border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.14); color: #fff; font: 600 16px system-ui, sans-serif; cursor: pointer; }
  #keypad, #note { position: fixed; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.75); font-family: system-ui, sans-serif; color: #fff; }
  #keypad[hidden], #note[hidden] { display: none; }
  .kp { width: min(300px, 86vw); max-height: 94vh; padding: 16px; border-radius: 14px; background: #1b1e22; border: 1px solid rgba(255,255,255,.2); text-align: center; }
  #kpDisplay { font: 700 30px ui-monospace, monospace; letter-spacing: .1em; padding: 8px 0; border-radius: 8px; background: #0b0d0f; color: #ff6a5a; }
  #kpDisplay.bad { animation: shake .3s; }
  #kpMsg { margin: 8px 0 10px; font-size: 13px; opacity: .8; min-height: 16px; }
  #kpGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #kpGrid button { padding: 0; height: 46px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: #2a2e33; color: #fff; font: 600 20px system-ui, sans-serif; cursor: pointer; }
  @keyframes shake { 20% { transform: translateX(-6px); } 60% { transform: translateX(6px); } }
  .noteCard { text-align: center; }
  .noteCard img { width: min(300px, 70vh); max-width: 80vw; transform: rotate(-2deg); box-shadow: 0 8px 30px rgba(0,0,0,.6); }
  .noteCard p { margin: 14px 0 0; opacity: .7; font-size: 13px; }
  #fire { position: fixed; right: 16px; bottom: 16px; z-index: 2; width: 84px; height: 84px; border-radius: 50%; border: 2px solid rgba(255,120,100,.7); background: rgba(160,30,20,.45); color: #fff; font: 700 15px system-ui, sans-serif; letter-spacing: .06em; cursor: pointer; }
  #fire[hidden] { display: none; }
  #drop { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 2; padding: 4px 26px; border: 0; background: none; color: #fff; font: 800 46px system-ui, sans-serif; letter-spacing: .14em; text-shadow: 0 2px 8px rgba(0,0,0,.9); cursor: pointer; }
  #drop[hidden] { display: none; }
  #start[hidden], #lidT[hidden], #lidB[hidden] { display: none; }
  /* the title screen: the game name top left, Dread standing in the room, Play and Options */
  #start { position: fixed; inset: 0; z-index: 9; color: #e8e2d8; font-family: system-ui, sans-serif; pointer-events: none; }
  #start > * { pointer-events: auto; }
  #gameTitle { position: absolute; left: max(22px, env(safe-area-inset-left, 0px)); top: max(10px, env(safe-area-inset-top, 0px)); margin: 0; font: 400 clamp(46px, 12vw, 104px) Georgia, 'Times New Roman', serif; letter-spacing: .12em; text-transform: uppercase; color: #e6dfd2; text-shadow: 0 0 24px rgba(170,0,0,.6), 0 2px 0 #000; animation: titleflick 8s infinite; pointer-events: none; }
  @keyframes titleflick { 0%, 91%, 100% { opacity: 1; } 92% { opacity: .3; } 93% { opacity: 1; } 95% { opacity: .5; } 96% { opacity: 1; } }
  #menuMain { position: absolute; left: max(26px, env(safe-area-inset-left, 0px)); bottom: max(34px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 4px; }
  .mbtn { background: none; border: 0; padding: 6px 0; text-align: left; color: #d8d2c8; font: 400 clamp(28px, 6.5vw, 40px) Georgia, 'Times New Roman', serif; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; text-shadow: 0 2px 10px #000; opacity: .85; }
  .mbtn:hover, .mbtn:focus-visible { opacity: 1; color: #fff; text-shadow: 0 0 14px rgba(200,30,30,.85); outline: none; }
  .panel { position: absolute; left: 50%; width: min(560px, 92vw); box-sizing: border-box; padding: 16px 18px; max-height: 84vh; overflow: auto; background: rgba(8,6,6,.88); border: 1px solid rgba(255,255,255,.14); transform: translateX(-50%); }
  #opts { top: 50%; transform: translate(-50%, -50%); }
  #mods { bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
  .panel h2 { margin: 0 0 8px; font: 400 20px Georgia, 'Times New Roman', serif; letter-spacing: .2em; text-transform: uppercase; }
  .row { display: grid; grid-template-columns: 1fr 1.3fr 58px; align-items: center; gap: 10px; margin: 9px 0; font-size: 14px; }
  .row input[type=range] { width: 100%; accent-color: #b3261a; }
  .row input[type=checkbox] { width: 22px; height: 22px; accent-color: #b3261a; justify-self: start; }
  .row output { text-align: right; opacity: .8; font-variant-numeric: tabular-nums; }
  .chips { display: flex; gap: 8px; margin: 6px 0 2px; flex-wrap: wrap; }
  .chip, .pbtn { padding: 10px 16px; border-radius: 6px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.07); color: #fff; font: 600 13px system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
  .pbtn.go { background: #8f1b12; border-color: #c8392d; }
  .btns { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; }
  .panel[hidden], #menuMain[hidden] { display: none; }
  #lidT, #lidB { position: fixed; left: 0; right: 0; height: 50%; z-index: 7; background: #000; pointer-events: none; }
  #lidT { top: 0; box-shadow: 0 6px 40px 18px #000; }
  #lidB { bottom: 0; box-shadow: 0 -6px 40px 18px #000; }
  #fade { position: fixed; inset: 0; z-index: 8; background: #000; opacity: 0; pointer-events: none; }
  body.waking #floor, body.waking #dot, body.waking #inv, body.waking #drop, body.waking #fire { opacity: 0; }
  #glow { position: fixed; inset: 0; z-index: 7; pointer-events: none; opacity: 0; mix-blend-mode: screen; }
  #fx { position: fixed; inset: 0; z-index: 7; pointer-events: none; }
  #fx[hidden] { display: none; }
  #win.front { background: rgba(255,247,230,.97); color: #2a2418; }
  #win.front button { background: rgba(42,36,24,.08); border-color: rgba(42,36,24,.35); color: #2a2418; }
  #win.hatch { background: radial-gradient(ellipse at 50% 20%, #1c2c5a, #04070e 75%); color: #dfe8ff; }
  #win.car { background: linear-gradient(to top, #ff8a4c, #ffd39a 60%, #fff0cf); color: #3a2010; }
  #win.car button { background: rgba(58,32,16,.1); border-color: rgba(58,32,16,.4); color: #3a2010; }
  /* the flashlight battery: a rough, worn bar with ragged edges, bottom left above the floor name */
  #battery { position: fixed; z-index: 2; left: 16px; bottom: 40px; width: 120px; height: 16px; padding: 3px; background: #1a1612; clip-path: polygon(0 12%, 4% 0, 18% 8%, 33% 0, 51% 6%, 68% 0, 84% 9%, 100% 2%, 98% 55%, 100% 100%, 82% 92%, 64% 100%, 47% 93%, 29% 100%, 12% 91%, 0 100%, 2% 50%); pointer-events: none; opacity: .75; }
  #battery.on { opacity: 1; }
  #battFill { height: 100%; width: 100%; background: repeating-linear-gradient(95deg, #c79a3a 0 5px, #a77d28 5px 8px, #d6ac4e 8px 11px); clip-path: polygon(0 10%, 3% 0, 97% 12%, 100% 0, 100% 100%, 96% 88%, 4% 100%, 0 85%); filter: saturate(.6) brightness(.8); transition: width .5s linear; }
  #battery.on #battFill { filter: none; }
  #battery.low #battFill { background: repeating-linear-gradient(95deg, #b8412c 0 5px, #8a2a1a 5px 8px, #cf5a40 8px 11px); animation: lowflash 1s steps(2) infinite; }
  @keyframes lowflash { 50% { opacity: .45; } }
  #battery[hidden] { display: none; }
  #inv { position: fixed; top: 40px; right: 12px; display: flex; gap: 8px; pointer-events: none; }
  .slot { padding: 0; pointer-events: none; position: relative; width: 52px; height: 52px; border-radius: 8px; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
  .slot.sel { border-color: #fff; background: rgba(255,255,255,.22); box-shadow: 0 0 0 2px rgba(255,255,255,.5); }
  .slot img { max-width: 44px; max-height: 44px; }
  .slot span { position: absolute; right: 3px; bottom: 1px; color: #fff; font: 700 12px system-ui, sans-serif; }
  #toast { position: fixed; left: 0; right: 0; bottom: 84px; text-align: center; color: #fff; font: 600 14px system-ui, sans-serif; pointer-events: none; }
  #toast[hidden] { display: none; }
  /* fear: a thin red bar top left and a heartbeat glow at the screen edges */
  #fear { position: fixed; z-index: 2; left: 16px; top: 16px; width: 110px; pointer-events: none; font: 700 11px system-ui, sans-serif; letter-spacing: .16em; color: rgba(255,255,255,.7); }
  #fear i { display: block; margin-top: 4px; height: 5px; background: rgba(255,255,255,.14); }
  #fear b { display: block; height: 100%; width: 0; background: #b3261a; }
  #fear[hidden] { display: none; }
  #fearV { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(120,0,0,0) 45%, rgba(120,0,0,.75) 100%); }
  #win.dead { background: radial-gradient(ellipse at 50% 40%, #2a0505, #000 80%); color: #e9c4c0; }
  #day { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; text-align: center; align-items: center; justify-content: center; background: #000; color: #d8d2c8; font: 300 clamp(34px, 9vw, 72px) Georgia, 'Times New Roman', serif; letter-spacing: .3em; text-transform: uppercase; transition: opacity 1.4s; pointer-events: none; }
  #day[hidden] { display: none; }
  #blood { position: fixed; inset: 0; z-index: 7; width: 100%; height: 100%; pointer-events: none; }
  #day small { display: block; margin-top: 18px; font: 400 14px system-ui, sans-serif; letter-spacing: .12em; opacity: .55; }
</style>
</head>
<body>
<div id="hide"></div>
<div id="fear" hidden>FEAR<i><b id="fearFill"></b></i></div>
<div id="fearV"></div>
<div id="day" hidden></div>
<canvas id="blood"></canvas>
<div id="dot"></div>
<div id="floor"></div>
<div id="battery" hidden><div id="battFill"></div></div>
<button id="use" type="button" aria-label="Use" hidden><img alt=""></button>
<div id="inv"></div>
<div id="toast" hidden></div>
<button id="fire" type="button" hidden>FIRE</button>
<button id="drop" type="button" hidden>DROP</button>
<div id="win" hidden><div><h1 id="winTitle">You escaped</h1><p id="winTime"></p><button id="again" type="button">Play again</button></div></div>
<div id="keypad" hidden><div class="kp"><div id="kpDisplay">_ _ _ _</div><div id="kpMsg"></div><div id="kpGrid"></div></div></div>
<div id="note" hidden><div class="noteCard"><img id="noteImg" alt="Sticky note"><p>Tap to put it away</p></div></div>
<div id="start">
  <h1 id="gameTitle">Dread</h1>
  <nav id="menuMain"><button class="mbtn" id="btnPlay" type="button">Play</button><button class="mbtn" id="btnOptions" type="button">Options</button></nav>
  <section class="panel" id="opts" hidden>
    <h2>Options</h2>
    <label class="row"><span>Sound</span><input type="checkbox" id="oSound"><span></span></label>
    <label class="row"><span>Look speed</span><input type="range" id="oSens" min="40" max="220" step="5"><output id="oSensV"></output></label>
    <label class="row"><span>Fear meter</span><input type="checkbox" id="oFear"><span></span></label>
    <div class="btns"><button class="pbtn" id="optBack" type="button">Back</button></div>
  </section>
  <section class="panel" id="mods" hidden>
    <h2>The nightmare</h2>
    <div class="chips"><button class="chip" data-preset="easy" type="button">Easy</button><button class="chip" data-preset="normal" type="button">Normal</button><button class="chip" data-preset="nightmare" type="button">Nightmare</button></div>
    <label class="row"><span>Dread's speed</span><input type="range" id="mSpeed" min="50" max="160" step="5"><output id="mSpeedV"></output></label>
    <label class="row"><span>Smell for fear</span><input type="range" id="mSense" min="0" max="200" step="10"><output id="mSenseV"></output></label>
    <label class="row"><span>Quiet at the start</span><input type="range" id="mGrace" min="0" max="60" step="5"><output id="mGraceV"></output></label>
    <label class="row"><span>Flashlight battery</span><input type="range" id="mBatt" min="50" max="300" step="10"><output id="mBattV"></output></label>
    <label class="row"><span>Days</span><input type="range" id="mDays" min="1" max="7" step="1"><output id="mDaysV"></output></label>
    <label class="row"><span>Dread is here</span><input type="checkbox" id="mDread"><span></span></label>
    <div class="btns"><button class="pbtn" id="modBack" type="button">Back</button><button class="pbtn go" id="btnBegin" type="button">Begin</button></div>
  </section>
</div>
<div id="lidT" hidden></div>
<div id="lidB" hidden></div>
<div id="glow"></div>
<canvas id="fx" hidden></canvas>
<div id="fade"></div>
<div id="stick"><div id="knob"></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
